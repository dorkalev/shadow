# Shadow compliance gates — copy into .github/workflows/compliance.yml
# Requires the shadow-ci crate vendored at .shadow/ci (see actions/README.md).
# Two phases, mirroring the audit/review-gate split:
#   audit        — runs immediately; tickets + traceability + tests. Bot reviews expected, not required.
#   review-gate  — same checks plus required reviewers and unresolved-findings gate.
# Register BOTH job names as required status checks on the staging ruleset.
name: Shadow Compliance

on:
  pull_request:
    branches: [staging, main]
    types: [opened, synchronize, reopened, ready_for_review, edited, labeled, unlabeled]

concurrency:
  group: shadow-compliance-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  checks: read

jobs:
  compliance:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - phase: awaiting-review
            key: audit
          - phase: post-review
            key: review-gate
    name: compliance-${{ matrix.key }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .shadow/ci

      - name: Build shadow-ci
        run: cargo build --release --manifest-path .shadow/ci/Cargo.toml

      - name: Run compliance ${{ matrix.key }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REVIEW_PHASE: ${{ matrix.phase }}
          AGENT_KEY: ${{ matrix.key }}
          # ---- tune per repo ----
          TICKET_PATTERN: "[A-Z]{2,6}-[0-9]+|#[0-9]+"   # Linear/Jira ids and GitHub issue refs
          CONFIDENCE_THRESHOLD: "70"
          EXPECTED_REVIEWERS: "shadow-reviewer"   # audit phase: noted if absent, not blocking
          REQUIRED_REVIEWERS: "shadow-reviewer"   # review-gate phase: blocking. Set to a third-party bot login if one is installed
          TEST_EXCLUDE_PATHS: ""             # csv of path prefixes exempt from test coverage
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}  # optional; omit to skip ticket verification
        run: .shadow/ci/target/release/shadow-ci check

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compliance-report-${{ matrix.key }}-${{ github.event.pull_request.number }}
          path: compliance_report.json
          retention-days: 90
