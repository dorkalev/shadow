# Daily drift detector — no LLM and no model key.
# Copy into .github/workflows/deterministic-verify.yml in an adopting repo.
name: Deterministic Shadow Verify

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write
  security-events: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: |
            .shadow/ci
            .shadow/site

      - name: Authenticate the read-only verifier to Google Cloud
        if: ${{ vars.GCP_VERIFY_SA != '' }}
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_VERIFY_SA }}

      - name: Build shadow-ci
        run: cargo build --release --manifest-path .shadow/ci/Cargo.toml

      - name: Verify repository, GitHub, and configured cloud controls
        env:
          GH_TOKEN: ${{ secrets.ORG_READ_TOKEN || secrets.GITHUB_TOKEN }}
          SHADOW_BRANCHES: "main"
          GCP_PROJECTS: ${{ vars.GCP_PROJECTS }}
        run: .shadow/ci/target/release/shadow-ci verify

      - name: Build static dashboard snapshot
        if: always()
        env:
          SHADOW_ORG: ${{ github.repository }}
        run: |
          cargo build --release --manifest-path .shadow/site/Cargo.toml
          .shadow/site/target/release/shadow seed \
            --criteria .shadow/criteria \
            --procedures .shadow/procedures/PROCEDURES.md \
            --db shadow/shadow.db
          if [ -f shadow/scope.json ]; then
            .shadow/site/target/release/shadow apply-scope \
              --db shadow/shadow.db --scope shadow/scope.json
          fi
          .shadow/site/target/release/shadow import-verify \
            --db shadow/shadow.db \
            --report shadow/readiness-latest.json
          .shadow/site/target/release/shadow render --db shadow/shadow.db --out dist

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: deterministic-shadow-verify-${{ github.run_id }}
          path: |
            shadow/verify-*.json
            shadow/readiness-*.json
            shadow/shadow.db
          retention-days: 400
          if-no-files-found: error

      - name: Upload dashboard snapshot
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: shadow-dashboard-${{ github.run_id }}
          path: dist/
          retention-days: 400
          if-no-files-found: error
