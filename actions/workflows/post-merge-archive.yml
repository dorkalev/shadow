# Post-merge evidence archive — copy into .github/workflows/post-merge-archive.yml
# On every merged PR: full JSON+MD record (PR, reviews, comments, checks, compliance
# report) with bypass detection against the live branch ruleset, committed to the
# protected compliance-archives branch. Only the GitHub Actions integration is
# granted append authority; force-push and deletion remain blocked.
name: Post-Merge Archive

on:
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: write
  pull-requests: read
  checks: read

jobs:
  archive:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          # The archive ruleset permits only the GitHub Actions integration to append.

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: .shadow/ci

      - name: Build shadow-ci
        run: cargo build --release --manifest-path .shadow/ci/Cargo.toml

      - name: Archive merged PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          TICKET_PATTERN: "[A-Z]{2,6}-[0-9]+|#[0-9]+"
          ARCHIVES_BRANCH: compliance-archives
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}  # optional
        run: .shadow/ci/target/release/shadow-ci archive
