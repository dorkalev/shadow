# Shadow Review — copy into .github/workflows/review.yml
# The built-in review bot for day-one installs: an opt-in LLM review
# adviser (Claude preferred; Gemini/Codex accepted — first configured key wins)
# reviews the PR diff and posts findings as inline review threads with severity
# prefixes. It is an automated advisory control, not an independent person.
# Repositories may require its completed-review marker by setting
# REQUIRED_REVIEWERS=shadow-reviewer; the solo-founder profile does not.
# Installing a third-party review-bot app later? Set REQUIRED_REVIEWERS to its
# login and delete this file — the gate treats them identically.
name: Shadow Review

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: shadow-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    # Fork PRs never get secrets (prompt-injection in a fork diff must not reach an
    # LLM holding API keys + a write token). Same-repo PRs only.
    if: ${{ !github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Install agent CLI
        id: llm
        env:
          LLM_REVIEW_ENABLED: ${{ vars.SHADOW_LLM_REVIEW == 'true' }}
          HAS_ANTHROPIC: ${{ secrets.ANTHROPIC_API_KEY != '' }}
          HAS_GEMINI: ${{ secrets.GEMINI_API_KEY != '' }}
          HAS_OPENAI: ${{ secrets.OPENAI_API_KEY != '' }}
        run: |
          set -euo pipefail
          if [ "$LLM_REVIEW_ENABLED" != "true" ]; then
            echo 'runner=' >> "$GITHUB_OUTPUT"
          elif [ "$HAS_ANTHROPIC" = "true" ]; then
            npm install -g @anthropic-ai/claude-code
            echo 'runner=claude --allowedTools Bash(gh:*),Read,Glob,Grep -p' >> "$GITHUB_OUTPUT"
          elif [ "$HAS_GEMINI" = "true" ]; then
            npm install -g @google/gemini-cli
            echo 'runner=gemini -p' >> "$GITHUB_OUTPUT"
          elif [ "$HAS_OPENAI" = "true" ]; then
            npm install -g @openai/codex
            echo 'runner=codex exec' >> "$GITHUB_OUTPUT"
          else
            echo 'runner=' >> "$GITHUB_OUTPUT"
          fi

      - name: Review the PR
        if: steps.llm.outputs.runner != ''
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          ${{ steps.llm.outputs.runner }} "$(cat .shadow/agent/06-code-review.md)"

      - name: No reviewer configured (loud, not silent)
        if: steps.llm.outputs.runner == ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          echo "::warning::no LLM key configured — optional automated semantic review did not run"
          gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -f body="<!-- shadow-review:unavailable -->
          ## Shadow Review
          ⚠️ **Automated semantic review did not run.** Set repo variable `SHADOW_LLM_REVIEW=true` and configure an LLM key to enable the optional adviser. This notice is evidence of non-operation and never satisfies a completed-review requirement." >/dev/null
