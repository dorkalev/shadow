name: Platform CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: |
            actions/shadow-ci
            website/app

      - name: Test deterministic control binary
        run: cargo test --manifest-path actions/shadow-ci/Cargo.toml --locked

      - name: Test gauge application
        run: cargo test --manifest-path website/app/Cargo.toml --locked

      - name: Install coverage tool
        uses: taiki-e/install-action@faf6515f98a6da02430741fd0af1094fde82286d # cargo-llvm-cov

      - name: Measure control binary coverage
        run: |
          mkdir -p coverage
          cargo llvm-cov --manifest-path actions/shadow-ci/Cargo.toml --locked \
            --fail-under-lines 20 --json --output-path coverage/shadow-ci.json

      - name: Measure gauge application coverage
        run: |
          cargo llvm-cov --manifest-path website/app/Cargo.toml --locked \
            --fail-under-lines 7 --json --output-path coverage/website.json

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: rust-coverage-${{ github.run_id }}
          path: coverage/*.json
          retention-days: 90
          if-no-files-found: error
