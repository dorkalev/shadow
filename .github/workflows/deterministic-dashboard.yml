# This repository's own, model-free SOC 2 dashboard snapshot.
name: Shadow Dashboard Snapshot

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  security-events: read

jobs:
  verify-and-render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: |
            actions/shadow-ci
            website/app

      - name: Build deterministic verifier and dashboard
        run: |
          cargo build --release --manifest-path actions/shadow-ci/Cargo.toml
          cargo build --release --manifest-path website/app/Cargo.toml

      - name: Verify live GitHub controls
        id: verify
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.ORG_READ_TOKEN || secrets.GITHUB_TOKEN }}
          SHADOW_BRANCHES: "main"
        run: actions/shadow-ci/target/release/shadow-ci verify

      - name: Render dashboard snapshot
        if: always()
        env:
          SHADOW_ORG: dorkalev/shadow
        run: |
          website/app/target/release/shadow seed \
            --criteria criteria \
            --procedures procedures/PROCEDURES.md \
            --db shadow/shadow.db
          if [ -f shadow/scope.json ]; then
            website/app/target/release/shadow apply-scope \
              --db shadow/shadow.db --scope shadow/scope.json
          fi
          website/app/target/release/shadow import-verify \
            --db shadow/shadow.db \
            --report shadow/readiness-latest.json
          website/app/target/release/shadow render --db shadow/shadow.db --out dist

      - name: Upload dashboard and verification evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: shadow-dashboard-${{ github.run_id }}
          path: |
            dist/
            shadow/verify-*.json
            shadow/readiness-*.json
            shadow/shadow.db
          retention-days: 400
          if-no-files-found: error
